<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Globo · mockups de texto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@600&family=Comic+Neue:wght@700&family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../taller/nav.js"></script>
<style>
:root{--bg:#eef0f4;--panel:#fff;--ink:#141418;--muted:#7a7a86;--line:#e6e7ec;--soft:#f4f5f8;--soft2:#e9eaf0;--hi:#0A7AFF;--chk1:#e6e7ec;--chk2:#f7f8fa;
  --sh:0 1px 2px rgba(16,18,30,.05),0 6px 20px rgba(16,18,30,.06);--sh2:0 12px 40px rgba(16,18,30,.16),0 2px 6px rgba(16,18,30,.08);
  --spring:cubic-bezier(.34,1.56,.64,1);--glass:rgba(255,255,255,.78)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0a0d;--panel:#141418;--ink:#f3f3f6;--muted:#9a9aa6;--line:#24242b;--soft:#1b1b21;--soft2:#25252d;--chk1:#16161b;--chk2:#1d1d23;--glass:rgba(24,24,30,.78);
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);--sh2:0 14px 44px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--bg:#0a0a0d;--panel:#141418;--ink:#f3f3f6;--muted:#9a9aa6;--line:#24242b;--soft:#1b1b21;--soft2:#25252d;--chk1:#16161b;--chk2:#1d1d23;--glass:rgba(24,24,30,.78);
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);--sh2:0 14px 44px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13.5px/1.4 Inter,system-ui,"Segoe UI",sans-serif;display:grid;grid-template-columns:320px 1fr 340px;grid-template-rows:60px minmax(0,1fr);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
svg.lucide{width:18px;height:18px;flex:none;stroke-width:2.1}
button{font:inherit;color:inherit}
/* ---------- header ---------- */
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.03em}
.logo .mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--hi) 70%,#fff),var(--hi) 60%,color-mix(in srgb,var(--hi) 70%,#000));box-shadow:0 6px 16px color-mix(in srgb,var(--hi) 45%,transparent);transition:transform .4s var(--spring)}
.logo:hover .mark{transform:rotate(-12deg) scale(1.08)}
.logo .mark svg{width:19px;height:19px}
.grow{flex:1}
/* segmented con indicador deslizante */
.seg{position:relative;display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg .ind{position:absolute;top:3px;bottom:3px;border-radius:9px;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.14);transition:left .35s var(--spring),width .35s var(--spring)}
.seg button{position:relative;z-index:1;border:0;background:none;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg button svg{width:16px;height:16px}
.seg.sm button{padding:5px 8px}
/* ---------- paneles ---------- */
aside{min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line);padding:0;gap:0;background:var(--panel)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:11px;font-weight:700;font-size:13px}
.ch .ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--hi) 14%,transparent);color:var(--hi)}
.ch .ico svg{width:16px;height:16px}
.ch .grow{flex:1}
textarea,input[type=text]{width:100%;background:var(--soft);color:var(--ink);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;font:inherit;outline:none;transition:border-color .15s,background .15s,box-shadow .15s}
textarea:focus,input[type=text]:focus{border-color:var(--hi);background:var(--panel);box-shadow:0 0 0 4px color-mix(in srgb,var(--hi) 16%,transparent)}
textarea{resize:vertical;min-height:92px;line-height:1.45}
.field{position:relative}
.field svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.field input{padding-left:33px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px;align-items:center}
/* botones */
.ib{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:transform .25s var(--spring),background .15s,border-color .15s,color .15s;flex:none}
.ib:hover{background:var(--soft2);transform:translateY(-1px)}
.ib:active{transform:scale(.88)}
.ib.on{background:var(--hi);border-color:var(--hi);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--hi) 40%,transparent)}
.ib.sm{width:30px;height:30px;border-radius:9px}
.ib.sm svg{width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:11px;padding:7px 11px;font-weight:600;font-size:12.5px;cursor:pointer;transition:transform .25s var(--spring),background .15s}
.pill:hover{background:var(--soft2)}
.pill:active{transform:scale(.92)}
.pill svg{width:15px;height:15px}
/* swatches */
.sw{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sw .s{width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;padding:0;position:relative;transition:transform .3s var(--spring);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw .s:hover{transform:scale(1.15)}
.sw .s.on{transform:scale(1.12);box-shadow:0 0 0 2.5px var(--panel),0 0 0 4.5px currentColor}
.sw .s.on::after{content:"";position:absolute;inset:9px;border-radius:50%;background:rgba(255,255,255,.95);animation:popin .35s var(--spring)}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
.sw .ib{width:28px;height:28px;border-radius:50%}
.sw .ib svg{width:14px;height:14px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--hi) var(--p,50%),var(--soft2) var(--p,50%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 4px color-mix(in srgb,var(--hi) 22%,transparent);transition:transform .25s var(--spring)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
.slider{display:flex;align-items:center;gap:10px;color:var(--muted)}
.slider b{font-size:11.5px;font-weight:700;min-width:26px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
/* dropdown propio */
.dd{position:relative;min-width:0}
.dd-btn{width:100%;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--soft);border-radius:13px;padding:6px 10px 6px 6px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .25s var(--spring)}
.dd-btn:hover{border-color:color-mix(in srgb,var(--hi) 45%,var(--line))}
.dd-btn:active{transform:scale(.97)}
.dd-btn.open{border-color:var(--hi);background:var(--panel);box-shadow:0 0 0 4px color-mix(in srgb,var(--hi) 15%,transparent)}
.dd-l{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.dd-l b{font-weight:650;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-l small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-chev{color:var(--muted);width:16px!important;height:16px!important;transition:transform .25s}
.dd-btn.open .dd-chev{transform:rotate(180deg)}
.bdg{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;background:var(--c,var(--soft2));box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.bdg svg{width:16px;height:16px}
.bdg.sw{border:1px solid var(--line);box-shadow:none}
.bdg.chk{background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0}
.dd-pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);padding:6px;overflow:auto;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top center;transition:opacity .15s,transform .25s var(--spring);pointer-events:none}
.dd-pop.up{transform-origin:bottom center;transform:translateY(6px) scale(.97)}
.dd-pop.on{opacity:1;transform:none;pointer-events:auto}
.dd-g{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:9px 10px 4px}
.dd-o{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:11px;padding:6px;cursor:pointer;text-align:left;transition:background .12s,transform .2s var(--spring)}
.dd-o:hover{background:var(--soft)}
.dd-o:active{transform:scale(.97)}
.dd-o.on{background:color-mix(in srgb,var(--hi) 11%,transparent)}
.dd-ck{color:var(--hi)}
/* chat */
.msgs{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.msg{display:flex;gap:6px;align-items:center;animation:slidein .35s var(--spring)}
@keyframes slidein{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.msg.me input{border-color:color-mix(in srgb,var(--hi) 30%,transparent)}
.msg .who{width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none;background:var(--soft2);color:var(--muted);transition:transform .3s var(--spring),background .2s}
.msg .who:active{transform:scale(.85) rotate(-10deg)}
.msg.me .who{background:var(--hi);color:#fff}
.msg .who svg{width:16px;height:16px}
.msg input{flex:1;min-width:0}
.msg .del{opacity:.45}
.msg:hover .del{opacity:1}
/* avatar */
.av{width:44px;height:44px;border-radius:50%;border:2px dashed var(--line);background:var(--soft) center/cover;display:grid;place-items:center;cursor:pointer;color:var(--muted);position:relative;flex:none;transition:transform .3s var(--spring)}
.av:hover{transform:scale(1.06);border-color:var(--hi);color:var(--hi)}
.av.has{border-style:solid;border-color:var(--hi)}
.av.has svg{display:none}
/* escenario */
main{position:relative;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:70px 30px 100px;position:relative;
  background-color:var(--chk2);background-image:linear-gradient(45deg,var(--chk1) 25%,transparent 25%),linear-gradient(-45deg,var(--chk1) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--chk1) 75%),linear-gradient(-45deg,transparent 75%,var(--chk1) 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0}
#stage{display:block;touch-action:none;transition:transform .35s var(--spring)}
#stage.bump{animation:bump .45s var(--spring)}
@keyframes bump{0%{transform:scale(.94)}100%{transform:scale(1)}}
#stage.photo{cursor:grab;box-shadow:var(--sh2);border-radius:10px}
.now{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:30px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--sh);white-space:nowrap;max-width:calc(100% - 32px)}
.now .bdg{width:28px;height:28px;border-radius:50%}
.now b{font-weight:700}
.now span{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.now .an{display:flex;align-items:center;gap:4px;color:var(--hi);font-weight:600;font-size:12px;padding-left:9px;border-left:1px solid var(--line)}
.now .an svg{width:14px;height:14px}
.rec{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:#e11d48;color:#fff;font-weight:700;font-size:12px;padding:5px 12px;border-radius:20px;display:none;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(225,29,72,.4)}
.rec.on{display:flex}
.rec i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.dock{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:7px;border-radius:20px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--sh2);max-width:calc(100% - 24px);flex-wrap:wrap;justify-content:center}
.dock .sep{width:1px;height:26px;background:var(--line);margin:0 3px}
.dock .ib{width:42px;height:42px;border-radius:13px;background:transparent;border-color:transparent}
.dock .ib:hover{background:var(--soft2)}
.dock .ib.on{background:var(--hi);color:#fff}
.dlw{display:flex;align-items:stretch;border-radius:13px;overflow:hidden;box-shadow:0 8px 20px color-mix(in srgb,var(--hi) 42%,transparent);transition:transform .25s var(--spring)}
.dlw:active{transform:scale(.94)}
.dlw button{border:0;background:var(--hi);color:#fff;cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px}
.dlw .main{padding:0 14px;height:42px}
.dlw .q{padding:0 10px;background:color-mix(in srgb,var(--hi) 80%,#000);font-variant-numeric:tabular-nums;font-size:12px}
.dlw button:hover{filter:brightness(1.08)}
.psize{display:flex;align-items:center;gap:8px;padding:0 8px;color:var(--muted);width:150px}
/* tooltips */
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:8px;white-space:nowrap;pointer-events:none;z-index:60;animation:tip .2s var(--spring)}
[data-tip].tipb:hover::after{bottom:auto;top:calc(100% + 9px)}
@keyframes tip{from{opacity:0;transform:translate(-50%,4px)}to{opacity:1;transform:translate(-50%,0)}}
/* galería */
.ghead{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{display:flex;align-items:center;gap:6px;height:34px;min-width:34px;justify-content:center;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:11px;padding:0 8px;cursor:pointer;font-weight:650;font-size:12px;transition:all .3s var(--spring)}
.cats button svg{width:16px;height:16px}
.cats button span{display:none}
.cats button:hover{color:var(--ink);transform:translateY(-1px)}
.cats button.on{background:var(--ink);color:var(--panel);border-color:var(--ink);padding:0 11px}
.cats button.on span{display:inline}
.gal{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:1fr;gap:10px;align-content:start}
.gal.g2{grid-template-columns:1fr 1fr}
.gc{border:1.5px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;background:var(--soft);display:flex;flex-direction:column;gap:8px;transition:transform .3s var(--spring),border-color .15s,box-shadow .2s;animation:cardin .4s var(--spring) both}
@keyframes cardin{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.gc:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:color-mix(in srgb,var(--hi) 35%,var(--line))}
.gc:active{transform:scale(.97)}
.gc.on{border-color:var(--hi);box-shadow:0 0 0 4px color-mix(in srgb,var(--hi) 18%,transparent)}
.gc .th{height:92px;display:flex;align-items:center;justify-content:center}
.gal.g2 .gc .th{height:74px}
.gc canvas{max-width:100%;max-height:100%;width:auto;height:auto}
.gc .ft{display:flex;align-items:center;gap:7px;min-width:0}
.gc .ft .bdg{width:22px;height:22px;border-radius:7px}
.gc .ft .bdg svg{width:13px;height:13px}
.gc .ft b{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .ft small{color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap}
.gal.g2 .gc .ft small{display:none}
.empty{color:var(--muted);text-align:center;padding:40px 10px;grid-column:1/-1}
/* toast + partículas */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px) scale(.9);background:#111;color:#fff;padding:10px 16px 10px 12px;border-radius:14px;font-weight:600;opacity:0;transition:all .35s var(--spring);pointer-events:none;z-index:70;display:flex;align-items:center;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast .ok{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#22c55e}
.toast .ok svg{width:14px;height:14px}
.dot{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:80}
.hint{display:flex;gap:8px;align-items:flex-start;margin-top:9px;padding:9px 11px;border-radius:12px;background:color-mix(in srgb,var(--hi) 10%,transparent);color:var(--ink);font-size:12px;line-height:1.4;animation:slidein .35s var(--spring)}
.hint svg{width:15px;height:15px;color:var(--hi);margin-top:1px}
.hide{display:none!important}
@media (max-width:1100px){body{grid-template-columns:290px 1fr 300px}}
@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-rows:60px auto auto auto;overflow:auto;height:auto}
  aside.left,aside.right{border:0;overflow:visible}
  main{min-height:72vh;order:-1}
  header{order:-2}
  .gal{grid-template-columns:1fr 1fr;max-height:none}
}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="mark"><i data-lucide="message-circle-heart"></i></div>Globo</div>
  <div class="seg" id="mode"><span class="ind"></span>
    <button data-v="styles" data-tip="Un solo elemento" class="tipb"><i data-lucide="square-mouse-pointer"></i>Estilo</button>
    <button data-v="chat" data-tip="Conversación completa" class="tipb"><i data-lucide="messages-square"></i>Chat</button>
  </div>
  <span class="grow"></span>
  <button class="ib tipb" id="uiTheme" data-tip="Tema de la interfaz"><i data-lucide="sun-moon"></i></button>
</header>

<aside class="left">
  <section class="card" id="cText">
    <div class="ch"><span class="ico"><i data-lucide="type"></i></span>Texto<span class="grow"></span>
      <span class="ib sm" data-tip="Enter: nueva línea · x = marcado · - = separador · ! = rojo"><i data-lucide="info"></i></span></div>
    <textarea id="text" placeholder="Escribí algo…"></textarea>
    <div class="hint hide" id="hint"><i data-lucide="hash"></i><span>Escribí la meta (<b>1M</b>, <b>250k</b>) o desde y hasta: <b>980000 1M</b></span></div>
  </section>

  <section class="card hide" id="cChat">
    <div class="ch"><span class="ico"><i data-lucide="messages-square"></i></span>Conversación</div>
    <div id="ddFamily"></div>
    <div class="msgs" id="msgs"></div>
    <div class="row"><button class="pill" id="addMe"><i data-lucide="user-round-plus"></i>Yo</button><button class="pill" id="addThem"><i data-lucide="user-plus"></i>Otro</button></div>
  </section>

  <section class="card">
    <div class="ch"><span class="ico"><i data-lucide="sparkles"></i></span>Animación<span class="grow"></span>
      <button class="ib sm on" id="play2" data-tip="Reproducir"><i data-lucide="play"></i></button></div>
    <div id="ddAnim"></div>
  </section>

  <section class="card">
    <div class="ch"><span class="ico"><i data-lucide="palette"></i></span>Apariencia</div>
    <div class="sw" id="sw"></div>
    <div style="height:12px"></div>
    <div class="row">
      <button class="ib" id="dark" data-tip="Modo oscuro del mockup"><i data-lucide="moon"></i></button>
      <div id="ddBg" style="flex:1"></div>
    </div>
    <div style="height:12px"></div>
    <div class="slider" data-tip="Margen alrededor"><i data-lucide="scan"></i><input type="range" id="pad" min="0" max="120" step="2"><b id="padV"></b></div>
  </section>

  <section class="card">

<script>
/* ============================== utilidades ============================== */
const $ = s => document.querySelector(s);
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"';
const SYS = `Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif,${EMO}`;
const MONO = `Consolas,"SF Mono",Menlo,"Courier New",monospace,${EMO}`;
const COMIC = `"Comic Neue","Comic Sans MS",cursive,${EMO}`;
const HAND = `Caveat,"Segoe Print",cursive,${EMO}`;
const BANG = `Bangers,Impact,"Arial Black",sans-serif,${EMO}`;
const WINF = `"Segoe UI Variable Text","Segoe UI",Inter,sans-serif,${EMO}`;
const ROBO = `Roboto,"Google Sans",Inter,sans-serif,${EMO}`;
const RETRO = `Tahoma,Verdana,"Segoe UI",sans-serif,${EMO}`;
const F = (size, weight = 400, fam = SYS) => `${weight} ${size}px ${fam}`;
const MC = document.createElement('canvas').getContext('2d');
const TAU = Math.PI * 2;

function hexRgb(h){ h = String(h).replace('#',''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); const n = parseInt(h, 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(h, a){ const [r,g,b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
function shade(h, amt){ const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt))); return '#' + hexRgb(h).map(f).map(v => v.toString(16).padStart(2,'0')).join(''); }
function readable(h){ const [r,g,b] = hexRgb(h); return (r*299 + g*587 + b*114) / 1000 > 165 ? '#000' : '#fff'; }

function wrapLines(ctx, text, maxW, indent = 0){
  const out = [];
  const lim = () => out.length === 0 ? maxW - indent : maxW;
  for (const para of String(text).split('\n')){
    let line = '';
    for (const tok of para.split(/(\s+)/).filter(Boolean)){
      const test = line + tok;
      if (line.trim() && ctx.measureText(test.trimEnd()).width > lim()){
        out.push(line.trimEnd()); line = /^\s+$/.test(tok) ? '' : tok;
      } else line = test;
      while (ctx.measureText(line).width > lim() && [...line].length > 1){
        const ch = [...line]; let i = ch.length - 1;
        while (i > 1 && ctx.measureText(ch.slice(0, i).join('')).width > lim()) i--;
        out.push(ch.slice(0, i).join('')); line = ch.slice(i).join('');
      }
    }
    out.push(line.trimEnd());
  }
  return out;
}
function block(ctx, text, o){
  const size = o.size, lh = o.lh || Math.round(size * 1.3), ind = o.indent || 0;
  ctx.font = F(size, o.weight || 400, o.fam || SYS);
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  let lines = wrapLines(ctx, text, o.maxW || 1e9, ind);
  if (o.maxLines && lines.length > o.maxLines){ lines = lines.slice(0, o.maxLines); lines[lines.length-1] = fit(ctx, lines[lines.length-1] + '…', o.maxW); }
  let w = 0; const widths = lines.map((l, i) => { const lw = ctx.measureText(l).width + (i === 0 ? ind : 0); w = Math.max(w, lw); return lw; });
  if (o.ls) ctx.letterSpacing = '0px';
  return { lines, widths, w: Math.ceil(w), h: lines.length * lh, lh, font: ctx.font, size, indent: ind, ls: o.ls || 0, lastW: widths[widths.length - 1] || 0 };
}
function paint(c, b, x, y, color, align = 'left', boxW = b.w){
  c.font = b.font; c.fillStyle = color; c.textBaseline = 'middle'; c.textAlign = 'left';
  if (b.ls) c.letterSpacing = b.ls + 'px';
  b.lines.forEach((l, i) => {
    const lw = b.widths[i];
    let lx = x + (i === 0 ? b.indent : 0);
    if (align === 'center') lx = x + (boxW - lw) / 2; else if (align === 'right') lx = x + boxW - lw;
    c.fillText(l, lx, y + i * b.lh + b.lh / 2 + 1);
  });
  if (b.ls) c.letterSpacing = '0px';
}
function fit(ctx, str, maxW){ if (ctx.measureText(str).width <= maxW) return str; const ch = [...str.replace(/…$/, '')]; while (ch.length && ctx.measureText(ch.join('') + '…').width > maxW) ch.pop(); return ch.join('') + '…'; }
function txt(c, s, x, y, font, color, align = 'left'){ c.font = font; c.fillStyle = color; c.textAlign = align; c.textBaseline = 'middle'; c.fillText(s, x, y); c.textAlign = 'left'; }
function tw(font, s){ MC.font = font; return MC.measureText(s).width; }
function shadow(c, color, blur, oy = 0){ c.shadowColor = color; c.shadowBlur = blur; c.shadowOffsetY = oy; c.shadowOffsetX = 0; }
function noShadow(c){ c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0; }
function heart(c, cx, cy, s){ c.beginPath(); c.moveTo(cx, cy + s*0.55); c.bezierCurveTo(cx - s*1.1, cy - s*0.15, cx - s*0.55, cy - s*0.95, cx, cy - s*0.35); c.bezierCurveTo(cx + s*0.55, cy - s*0.95, cx + s*1.1, cy - s*0.15, cx, cy + s*0.55); c.closePath(); }
function lines(s){ return String(s.text).split('\n').map(l => l.trim()).filter(Boolean); }
const AV = { img: null };
function avatar(c, x, y, r, s){
  c.save(); c.beginPath(); c.arc(x + r, y + r, r, 0, TAU); c.closePath();
  if (AV.img){ c.clip(); const im = AV.img, k = Math.max(2*r / im.width, 2*r / im.height); c.drawImage(im, x + r - im.width*k/2, y + r - im.height*k/2, im.width*k, im.height*k); }
  else {
    const g = c.createLinearGradient(x, y, x + 2*r, y + 2*r); g.addColorStop(0, shade(s.accent, .4)); g.addColorStop(1, shade(s.accent, -.25));
    c.fillStyle = g; c.fill();
    txt(c, ([...(s.name || '?').trim()][0] || '?').toUpperCase(), x + r, y + r + 1, F(Math.round(r*0.95), 600), '#fff', 'center');
  }
  c.restore();
}
const T = s => s.dark ? { fg:'#fff', muted:'#98989f', card:'#1c1c1e', line:'#38383a', soft:'#2c2c2e' } : { fg:'#000', muted:'#8e8e93', card:'#fff', line:'#e5e5ea', soft:'#f2f2f7' };

/* ============================== burbujas base ============================== */
// Las colitas deben girar en el mismo sentido que roundRect (horario); si no, la
// regla nonzero "agujerea" la zona donde se superponen con la burbuja.
function tailPath(c, bx, by, dir){
  if (dir > 0){
    c.moveTo(bx - 1, by - 17);
    c.quadraticCurveTo(bx, by - 4, bx + 7, by);
    c.quadraticCurveTo(bx - 3, by + 1, bx - 14, by - 4);
  } else {
    c.moveTo(bx + 14, by - 4);
    c.quadraticCurveTo(bx + 3, by + 1, bx - 7, by);
    c.quadraticCurveTo(bx, by - 4, bx + 1, by - 17);
  }
  c.closePath();
}
function imsg(ctx, s, o){
  const size = o.size || 17, b = block(ctx, s.text || ' ', { size, maxW: o.maxW || 250, lh: Math.round(size * 1.3) });
  const padX = o.padX || 13, padY = o.padY || 7, TL = o.noTailSpace ? 0 : 8, right = o.side === 'right';
  const bw = Math.max(b.w + padX*2, 40), bh = b.h + padY*2, r = Math.min(o.r || 19, bh/2);
  const tail = o.tail !== false && !o.noTailSpace;
  const path = (c, x) => { c.beginPath(); c.roundRect(x, 0, bw, bh, r); if (tail) tailPath(c, right ? x + bw : x, bh, right ? 1 : -1); };
  return { w: bw + TL, h: bh + (tail ? 1 : 0), draw(c){
    const x = right ? 0 : TL;
    path(c, x);
    c.fillStyle = typeof o.bg === 'function' ? o.bg(c, x, 0, bw, bh) : o.bg;
    if (o.glossy) shadow(c, 'rgba(0,0,0,.25)', 2, 1);
    c.fill(); noShadow(c);
    if (o.glossy){
      c.save(); path(c, x); c.clip();
      const g = c.createLinearGradient(0, 0, 0, bh * .55); g.addColorStop(0, 'rgba(255,255,255,.7)'); g.addColorStop(1, 'rgba(255,255,255,.08)');
      c.fillStyle = g; c.beginPath(); c.roundRect(x + 5, 2, bw - 10, bh * .48, [r - 5, r - 5, 6, 6]); c.fill(); c.restore();
    }
    paint(c, b, x + padX, padY, o.fg);
  }};
}
function checks(c, x, y, color, double = true){
  c.strokeStyle = color; c.lineWidth = 1.5; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath();
  c.moveTo(x, y); c.lineTo(x + 3.2, y + 3.4); c.lineTo(x + 9.5, y - 3.8);
  if (double){ c.moveTo(x + 6.2, y + 2.4); c.lineTo(x + 7.4, y + 3.4); c.lineTo(x + 13.7, y - 3.8); }
  c.stroke();
}
function wa(ctx, s, o){
  const right = o.side === 'right', size = 15.5, maxW = 280;
  const b = block(ctx, s.text || ' ', { size, maxW, lh: 21 });
  const tf = F(11.5, 400), metaW = tw(tf, s.time) + (right ? 20 : 0);
  let iw = b.w, ih = b.h;
  if (b.lastW + metaW + 10 <= maxW) iw = Math.max(b.w, b.lastW + metaW + 10); else { ih += 15; iw = Math.max(b.w, metaW); }
  const padX = 9, padT = 6, padB = 8, bw = iw + padX*2, bh = ih + padT + padB, TL = 8, tail = !s.noTail;
  return { w: bw + TL, h: bh + 1, draw(c){
    const x = right ? 0 : TL;
    c.beginPath(); c.roundRect(x, 0, bw, bh, tail ? (right ? [8,0,8,8] : [0,8,8,8]) : 8);
    if (tail){ if (right){ c.moveTo(x + bw - 2, 0); c.lineTo(x + bw + 8, 0); c.quadraticCurveTo(x + bw + 8.5, 1.2, x + bw + 7, 2.4); c.lineTo(x + bw, 11); c.closePath(); }
               else { c.moveTo(x, 11); c.lineTo(x - 7, 2.4); c.quadraticCurveTo(x - 8.5, 1.2, x - 8, 0); c.lineTo(x + 2, 0); c.closePath(); } }
    c.fillStyle = right ? (s.dark ? '#005C4B' : '#D9FDD3') : (s.dark ? '#202C33' : '#fff');
    shadow(c, 'rgba(11,20,26,.13)', 1, 1); c.fill(); noShadow(c);
    paint(c, b, x + padX, padT, s.dark ? '#E9EDEF' : '#111B21');
    const my = bh - padB - 3, mx = x + bw - padX - metaW;
    txt(c, s.time, mx, my, tf, s.dark ? 'rgba(233,237,239,.6)' : '#667781');
    if (right) checks(c, x + bw - padX - 15, my, '#53BDEB');
  }};
}
function ig(ctx, s, o){
  const right = o.side === 'right', b = block(ctx, s.text || ' ', { size: 15, maxW: 240, lh: 20 });
  const bw = Math.max(b.w + 28, 44), bh = b.h + 20;
  return { w: bw, h: bh, draw(c){
    c.beginPath(); c.roundRect(0, 0, bw, bh, Math.min(22, bh/2));
    if (right){ const g = c.createLinearGradient(0, 0, bw, bh); g.addColorStop(0, '#7A3CFF'); g.addColorStop(1, '#B23CE8'); c.fillStyle = g; }
    else c.fillStyle = s.dark ? '#262626' : '#EFEFEF';
    c.fill(); paint(c, b, 14, 10, right ? '#fff' : (s.dark ? '#fff' : '#000'));
  }};
}
const recv = s => ({ side:'left', bg: s.dark ? '#262628' : '#E9E9EB', fg: s.dark ? '#fff' : '#000', tail: !s.noTail });

/* ============================== estilos ============================== */
const STYLES = [];
const STY = {};
function def(id, name, cat, L, anchor = 'lt'){ const st = { id, name, cat, L, anchor }; STYLES.push(st); STY[id] = st; }

// ---- Mensajes
def('msg-sent', 'Mensaje enviado', 'Mensajes', (x, s) => imsg(x, s, { side:'right', bg:s.accent, fg:readable(s.accent), tail:!s.noTail }), 'rb');
def('msg-received', 'Mensaje recibido', 'Mensajes', (x, s) => imsg(x, s, recv(s)), 'lb');
def('sms-green', 'SMS verde', 'Mensajes', (x, s) => imsg(x, s, { side:'right', bg:'#34C759', fg:'#fff', tail:!s.noTail }), 'rb');
def('msg-flat', 'Mensaje plano', 'Mensajes', (x, s) => imsg(x, s, { side:'right', bg:s.accent, fg:readable(s.accent), noTailSpace:true }), 'rb');
def('classic-sent', 'Clásico enviado', 'Mensajes', (x, s) => imsg(x, s, { side:'right', glossy:true, r:17, fg:'#fff', tail:!s.noTail,
  bg:(c, X, Y, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, shade(s.accent, .25)); g.addColorStop(1, shade(s.accent, -.15)); return g; } }), 'rb');
def('classic-received', 'Clásico recibido', 'Mensajes', (x, s) => imsg(x, s, { side:'left', glossy:true, r:17, fg:s.dark ? '#fff' : '#000', tail:!s.noTail,
  bg:(c, X, Y, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, s.dark ? '#5a5a5e' : '#f4f4f4'); g.addColorStop(1, s.dark ? '#2c2c2e' : '#cfcfd4'); return g; } }), 'lb');
def('wa-sent', 'Chat verde enviado', 'Mensajes', (x, s) => wa(x, s, { side:'right' }), 'rb');
def('wa-received', 'Chat verde recibido', 'Mensajes', (x, s) => wa(x, s, { side:'left' }), 'lb');
def('tapback', 'Reacción con corazón', 'Mensajes', (ctx, s) => {
  const b = imsg(ctx, s, recv(s)), top = 22;
  return { w: b.w + 16, h: b.h + top, draw(c){
    c.save(); c.translate(0, top); b.draw(c); c.restore();
    const cx = b.w - 1, cy = 17, ring = s.dark ? '#000' : '#fff';
    c.fillStyle = s.accent; c.strokeStyle = ring; c.lineWidth = 2.5;
    c.beginPath(); c.arc(cx - 19, cy + 21, 2.4, 0, TAU); c.fill();
    c.beginPath(); c.arc(cx - 13, cy + 15, 5, 0, TAU); c.fill(); c.stroke();
    c.beginPath(); c.arc(cx, cy, 16, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = readable(s.accent); heart(c, cx, cy + 1, 8.5); c.fill();
  }};
}, 'lb');
def('emoji-react', 'Reacciones con emoji', 'Mensajes', (ctx, s) => {
  const b = imsg(ctx, s, recv(s)), pf = F(14, 500), label = '❤️ 😂 👍  ' + (s.likes ? String(s.likes).slice(0, 4) : '3');
  const pw = tw(pf, label) + 20;
  return { w: Math.max(b.w, pw + 18), h: b.h + 18, draw(c){
    b.draw(c);
    const x = 14, y = b.h - 8;
    c.beginPath(); c.roundRect(x, y, pw, 26, 13);
    c.fillStyle = s.dark ? '#2c2c2e' : '#fff'; shadow(c, 'rgba(0,0,0,.18)', 6, 1); c.fill(); noShadow(c);
    c.strokeStyle = s.dark ? '#000' : '#fff'; c.lineWidth = 2; c.stroke();
    txt(c, label, x + 10, y + 13.5, pf, s.dark ? '#ddd' : '#555');
  }};
});
def('ig-sent', 'DM enviado', 'Mensajes', (x, s) => ig(x, s, { side:'right' }), 'rb');
def('ig-received', 'DM recibido', 'Mensajes', (x, s) => ig(x, s, { side:'left' }), 'lb');
def('notif', 'Notificación', 'Mensajes', (ctx, s) => {
  const W = 360, pad = 14, ic = 38, tx = pad + ic + 12;
  const b = block(ctx, s.text || ' ', { size: 15, maxW: W - tx - pad, lh: 20, maxLines: 4 });
  const H = pad + 22 + b.h + pad - 2;
  return { w: W, h: H, draw(c){
    c.beginPath(); c.roundRect(0, 0, W, H, 22);
    c.fillStyle = s.dark ? 'rgba(44,44,46,.97)' : 'rgba(246,246,248,.97)'; shadow(c, 'rgba(0,0,0,.18)', 18, 6); c.fill(); noShadow(c);
    const iy = pad + 2, g = c.createLinearGradient(0, iy, 0, iy + ic); g.addColorStop(0, shade(s.accent, .25)); g.addColorStop(1, s.accent);
    c.fillStyle = g; c.beginPath(); c.roundRect(pad, iy, ic, ic, 9); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.ellipse(pad + 19, iy + 18, 11.5, 9.5, 0, 0, TAU); c.fill();
    c.beginPath(); c.moveTo(pad + 11, iy + 22); c.lineTo(pad + 8.5, iy + 29.5); c.lineTo(pad + 17, iy + 26); c.fill();
    c.font = F(13); const tm = 'ahora';
    txt(c, fit(c, s.name || 'Mensajes', W - tx - pad - 50), tx, pad + 10, F(15, 600), s.dark ? '#fff' : '#000');
    txt(c, tm, W - pad, pad + 10, F(13), s.dark ? '#98989f' : '#8a8a8e', 'right');
    paint(c, b, tx, pad + 22, s.dark ? '#f2f2f2' : '#1c1c1e');
  }};
});

// ---- Redes
def('comment', 'Comentario de foto', 'Redes', (ctx, s) => {
  const W = 380, X = 44, uf = F(14, 600), uw = tw(uf, s.user) + 6;
  const b = block(ctx, s.text || ' ', { size: 14, maxW: W - X - 30, lh: 19, indent: uw });
  const H = Math.max(34, b.h + 26);
  return { w: W, h: H, draw(c){
    const t = T(s);
    avatar(c, 0, 0, 16, s);
    txt(c, s.user, X, 9.5 + 1, uf, t.fg); paint(c, b, X, 0, t.fg);
    const mf = F(12, 600); let mx = X; const my = b.h + 14;
    for (const m of ['2 h', `${s.likes} Me gusta`, 'Responder']){ txt(c, m, mx, my, mf, t.muted); mx += tw(mf, m) + 16; }
    c.strokeStyle = t.muted; c.lineWidth = 1.4; heart(c, W - 9, 11, 7.5); c.stroke();
  }};
});
def('reply', 'Respuesta a comentario', 'Redes', (ctx, s) => {
  const maxW = 280, pad = 12, hf = F(12, 500);
  const head = `Responder al comentario de ${s.user}`;
  const b = block(ctx, s.text || ' ', { size: 16, weight: 700, maxW, lh: 21 });
  const hw = Math.min(maxW, tw(hf, head) + 24);
  const W = Math.max(b.w, hw) + pad*2, H = pad + 22 + b.h + pad - 2;
  return { w: W, h: H + 9, draw(c){
    const bg = s.dark ? '#262626' : '#fff', fg = s.dark ? '#fff' : '#161823';
    c.fillStyle = bg; shadow(c, 'rgba(0,0,0,.18)', 10, 3);
    c.beginPath(); c.roundRect(0, 0, W, H, 10); c.moveTo(30, H - 1); c.lineTo(16, H + 9); c.lineTo(16, H - 1); c.closePath(); c.fill(); noShadow(c);
    avatar(c, pad, pad, 9, s);
    c.font = hf; txt(c, fit(c, head, W - pad*2 - 24), pad + 24, pad + 9.5, hf, s.dark ? '#aaa' : '#8a8b91');
    paint(c, b, pad, pad + 22, fg);
  }};
});
def('yt', 'Comentario de video', 'Redes', (ctx, s) => {
  const W = 430, X = 52, b = block(ctx, s.text || ' ', { size: 14, maxW: W - X, lh: 20 });

def('ctxmenu', 'Menú contextual', 'Menús', (ctx, s) => {
  let it = lines(s); if (it.length <= 1) it = [it[0] || 'Responder', 'Copiar', 'Reenviar', '-', '!Eliminar'];
  const f = F(14.5), w = Math.max(200, ...it.map(l => tw(f, l.replace(/^!/, '')) + 44));
  const H = it.reduce((a, l) => a + (l === '-' ? 9 : 32), 10);
  return { w, h: H, draw(c){
    c.beginPath(); c.roundRect(0, 0, w, H, 12); c.fillStyle = s.dark ? 'rgba(40,40,42,.98)' : 'rgba(250,250,252,.98)';
    shadow(c, 'rgba(0,0,0,.25)', 24, 8); c.fill(); noShadow(c);
    c.strokeStyle = s.dark ? 'rgba(255,255,255,.1)' : 'rgba(0,0,0,.08)'; c.lineWidth = 1; c.stroke();
    let y = 5, first = true;
    for (const l of it){
      if (l === '-'){ c.fillStyle = s.dark ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.1)'; c.fillRect(12, y + 4, w - 24, 1); y += 9; continue; }
      const red = l.startsWith('!'), label = l.replace(/^!/, '');
      if (first){ c.beginPath(); c.roundRect(5, y, w - 10, 32, 7); c.fillStyle = s.accent; c.fill(); }
      txt(c, label, 16, y + 16.5, f, first ? readable(s.accent) : red ? '#FF3B30' : (s.dark ? '#fff' : '#1c1c1e'));
      first = false; y += 32;
    }
  }};
});
def('select', 'Desplegable', 'Menús', (ctx, s) => {
  const it = lines(s).length ? lines(s) : ['Elegí una opción'], f = F(15), W = Math.max(240, ...it.map(l => tw(f, l) + 64));
  const open = it.length > 1, listH = open ? (it.length) * 36 + 8 : 0, top = 20, H = top + 44 + (open ? listH + 6 : 0);
  return { w: W, h: H + 6, draw(c){
    const t = T(s);
    txt(c, s.name || 'Opción', 2, 8, F(12, 600), t.muted);
    c.beginPath(); c.roundRect(0, top, W, 44, 10); c.fillStyle = t.card; c.fill(); c.strokeStyle = open ? s.accent : t.line; c.lineWidth = open ? 2 : 1; c.stroke();
    txt(c, it[0], 14, top + 22.5, f, t.fg);
    c.strokeStyle = t.muted; c.lineWidth = 2; c.lineCap = 'round'; c.beginPath();
    if (open){ c.moveTo(W - 26, top + 25); c.lineTo(W - 20, top + 19); c.lineTo(W - 14, top + 25); } else { c.moveTo(W - 26, top + 19); c.lineTo(W - 20, top + 25); c.lineTo(W - 14, top + 19); }
    c.stroke();
    if (!open) return;
    const ly = top + 50; c.beginPath(); c.roundRect(0, ly, W, listH, 10); c.fillStyle = t.card; shadow(c, 'rgba(0,0,0,.18)', 18, 6); c.fill(); noShadow(c);
    it.forEach((l, i) => { const y = ly + 4 + i*36;
      if (i === 0){ c.beginPath(); c.roundRect(4, y, W - 8, 36, 7); c.fillStyle = rgba(s.accent, s.dark ? .3 : .12); c.fill(); }
      txt(c, l, 14, y + 18.5, i === 0 ? F(15, 600) : f, i === 0 ? (s.dark ? shade(s.accent, .4) : shade(s.accent, -.2)) : t.fg);
      if (i === 0){ c.strokeStyle = s.accent; c.lineWidth = 2; c.beginPath(); c.moveTo(W - 28, y + 18); c.lineTo(W - 23, y + 23); c.lineTo(W - 14, y + 13); c.stroke(); }
    });
  }};
});
def('checklist', 'Checklist', 'Menús', (ctx, s) => {
  const ls = lines(s).filter(l => l !== '-').map(l => l.replace(/^!/, ''));
  const raw = ls.length ? ls : ['x Tarea lista', 'Tarea pendiente'];
  const it = raw.map(l => { const m = l.match(/^(\[x\]|x)\s+/i); return { done: !!m, t: m ? l.slice(m[0].length) : l.replace(/^\[\s?\]\s*/, '') }; });
  const f = F(15), W = Math.max(240, ...it.map(i => tw(f, i.t) + 66)), H = it.length * 40 + 16;
  return { w: W, h: H + 6, draw(c){
    const t = T(s); c.beginPath(); c.roundRect(0, 0, W, H, 14); c.fillStyle = t.card; shadow(c, 'rgba(0,0,0,.12)', 14, 4); c.fill(); noShadow(c);
    it.forEach((i, k) => { const y = 8 + k*40;
      if (k) { c.fillStyle = t.line; c.fillRect(48, y, W - 60, 1); }
      c.beginPath(); c.roundRect(16, y + 10, 20, 20, 6);
      if (i.done){ c.fillStyle = s.accent; c.fill(); c.strokeStyle = readable(s.accent); c.lineWidth = 2.2; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(21, y + 20); c.lineTo(24.5, y + 23.5); c.lineTo(31, y + 16.5); c.stroke(); }
      else { c.strokeStyle = t.muted; c.lineWidth = 1.6; c.stroke(); }
      txt(c, i.t, 48, y + 20.5, f, i.done ? t.muted : t.fg);
      if (i.done){ c.fillStyle = t.muted; c.fillRect(48, y + 20, tw(f, i.t), 1.3); }
    });
  }};
});

// ---- Ventanas
function bevel(c, x, y, w, h, raised = true){
  c.fillStyle = '#C0C0C0'; c.fillRect(x, y, w, h);
  c.fillStyle = raised ? '#DFDFDF' : '#808080'; c.fillRect(x, y, w, 1); c.fillRect(x, y, 1, h);
  c.fillStyle = raised ? '#000' : '#fff'; c.fillRect(x, y + h - 1, w, 1); c.fillRect(x + w - 1, y, 1, h);
  c.fillStyle = raised ? '#fff' : '#000'; c.fillRect(x + 1, y + 1, w - 2, 1); c.fillRect(x + 1, y + 1, 1, h - 2);
  c.fillStyle = raised ? '#808080' : '#DFDFDF'; c.fillRect(x + 1, y + h - 2, w - 2, 1); c.fillRect(x + w - 2, y + 1, 1, h - 2);
}

    c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath(); c.roundRect(x + 8, 12, 96, 40, 4); c.fill();

def('file', 'Archivo', 'Archivos', (ctx, s) => {

  return { w: W, h: H, draw(c){
    const x = (W - 78) / 2, fo = 20, d = s.dark;
    c.beginPath(); c.moveTo(x, 4); c.lineTo(x + 78 - fo, 4); c.lineTo(x + 78, 4 + fo); c.lineTo(x + 78, 100); c.lineTo(x, 100); c.closePath();
    c.fillStyle = d ? '#e9e9ee' : '#fff'; shadow(c, 'rgba(0,0,0,.2)', 6, 2); c.fill(); noShadow(c);
    c.strokeStyle = 'rgba(0,0,0,.12)'; c.lineWidth = 1; c.stroke();
    c.fillStyle = '#d6d6dc'; c.beginPath(); c.moveTo(x + 78 - fo, 4); c.lineTo(x + 78 - fo, 4 + fo); c.lineTo(x + 78, 4 + fo); c.closePath(); c.fill();
    c.fillStyle = 'rgba(0,0,0,.09)'; for (let i = 0; i < 4; i++) c.fillRect(x + 12, 34 + i * 9, 54 - (i === 3 ? 18 : 0), 3);

    c.beginPath(); c.roundRect(0, 0, W, H, 7); c.fillStyle = s.dark ? rgba(s.accent, .32) : rgba(s.accent, .16); c.fill();
    c.fillStyle = s.accent; c.beginPath(); c.roundRect(0, 0, 4.5, H, [7, 0, 0, 7]); c.fill();

}, 'ct');

def('sticky', 'Post-it', 'Texto', (ctx, s) => {
  const b = block(ctx, s.text || ' ', { size: 30, weight: 600, fam: HAND, maxW: 200, lh: 33 }), S = Math.max(230, b.h + 64), M = 14;
  return { w: S + M*2, h: S + M*2, draw(c){

}

// ============================== Creadores: contadores ==============================
function parseNums(t){
  const out = [], re = /(\d+(?:[.,]\d+)*)\s*(millones|millón|millon|mil|k|m)?(?![a-záéíóú])/gi; let m;
  while ((m = re.exec(String(t)))){
    const suf = (m[2] || '').toLowerCase(), mult = suf === 'k' || suf === 'mil' ? 1e3 : suf ? 1e6 : 1;
    out.push(mult > 1 ? Math.round(parseFloat(m[1].replace(',', '.')) * mult) : parseInt(m[1].replace(/[.,]/g, ''), 10));
  }
  return out.filter(n => isFinite(n));
}
function counterRange(s, def, ratio){ const n = parseNums(s.text), to = n.length ? n[n.length - 1] : def; return { from: n.length > 1 ? n[0] : Math.round(to * ratio), to }; }
const seeded = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const odoDigits = v => { const f = Math.floor(v), a = String(f).length, b = String(f + 1).length; return v % 1 > .001 && b > a ? b : a; };
function odoWidth(c, n, font){ c.font = font; return n * c.measureText('0').width + Math.floor((n - 1) / 3) * c.measureText('.').width; }
// Cuentakilómetros: cada dígito rueda hacia arriba cuando el de la derecha pasa de 9 a 0.
function odo(c, v, n, x, y, lh, font, col){
  c.font = font; const dw = c.measureText('0').width, sw = c.measureText('.').width;
  c.save(); c.beginPath(); c.rect(x - 4, y, odoWidth(c, n, font) + 8, lh); c.clip();
  c.textBaseline = 'middle'; c.textAlign = 'center'; c.fillStyle = col;
  let cx = x;
  for (let i = n - 1; i >= 0; i--){
    const P = Math.pow(10, i), whole = Math.floor(v / P), d = whole % 10;
    const roll = i === 0 ? v % 1 : Math.max(0, (v % P) - (P - 1));
    const cur = whole === 0 ? '' : String(d), nxt = String((d + 1) % 10);
    const mid = y + lh / 2 + 2;
    if (cur) c.fillText(cur, cx + dw / 2, mid - roll * lh);
    if (roll > 0) c.fillText(nxt, cx + dw / 2, mid + lh - roll * lh);
    cx += dw;
    if (i > 0 && i % 3 === 0){ if (whole > 0 || roll > 0) c.fillText('.', cx + sw / 2, mid); cx += sw; }
  }
  c.restore();
}
function confetti(c, x, y, age, cols){
  for (let i = 0; i < 46; i++){
    const a = -Math.PI / 2 + (seeded(i, 1) - .5) * 2.4, sp = 220 + seeded(i, 2) * 260;
    const px = x + Math.cos(a) * sp * age, py = y + Math.sin(a) * sp * age + 520 * age * age;
    const al = age < 1 ? 1 : Math.max(0, 1 - (age - 1) / .6); if (al <= 0) continue;
    c.save(); c.globalAlpha *= al; c.translate(px, py); c.rotate(age * (6 + seeded(i, 3) * 8)); c.scale(1, Math.cos(age * (8 + seeded(i, 4) * 6)));
    c.fillStyle = cols[i % cols.length]; c.fillRect(-4, -2.5, 8, 5); c.restore();
  }
}
function icoBell(c, x, y, col){ c.save(); c.translate(x, y); c.strokeStyle = col; c.lineWidth = 1.8; c.lineJoin = 'round'; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-7, 4); c.quadraticCurveTo(-6, 2, -6, -2); c.arc(0, -2, 6, Math.PI, 0); c.quadraticCurveTo(6, 2, 7, 4); c.closePath(); c.stroke();
  c.beginPath(); c.arc(0, 6, 2.2, 0, Math.PI); c.stroke(); c.restore(); }
const compactNum = n => new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(Math.round(n));

const fmtES = n => new Intl.NumberFormat('es-AR').format(Math.round(n));
const fmtCompactES = n => new Intl.NumberFormat('es', { notation: 'compact', maximumFractionDigits: 1 }).format(Math.round(n));
const cState = (s, p) => ({ live: s.t != null, t: s.t, active: s.t == null || s.t >= (s.tStart || 0), age: s.t == null ? 9 : s.t - (s.tStart || 0), done: p >= 1, endAge: s.t == null ? 9 : s.t - (s.tEnd || 0), ticking: s.t != null && p > 0 && p < 1 });
function card(c, s, W, H, r = 20){
  c.beginPath(); c.roundRect(0, 0, W, H, r); c.fillStyle = s.dark ? '#0F0F10' : '#FFFFFF'; shadow(c, 'rgba(0,0,0,.18)', 24, 8); c.fill(); noShadow(c);
  if (s.dark){ c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 1; c.stroke(); }
}
function personGlyph(c, x, y, col, k = 1){ c.fillStyle = col; c.beginPath(); c.arc(x, y - 3.5 * k, 3.3 * k, 0, TAU); c.fill(); c.beginPath(); c.arc(x, y + 6 * k, 6 * k, Math.PI, 0); c.fill(); }
function burstRing(c, x, y, age, col, n = 8, r0 = 14, r1 = 46){
  if (age < 0 || age > .55) return; const k = age / .55;
  c.save(); c.globalAlpha *= 1 - k; c.strokeStyle = col; c.lineWidth = 2.5 * (1 - k) + .5; c.beginPath(); c.arc(x, y, r0 + k * (r1 - r0), 0, TAU); c.stroke();
  c.fillStyle = col; for (let j = 0; j < n; j++){ const a = j / n * TAU, r = r0 + 4 + eoc(k) * (r1 - r0 + 8); c.beginPath(); c.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, 2.6 * (1 - k) + .6, 0, TAU); c.fill(); }
  c.restore();
}
function thumbGlyph(c, x, y, col, fill, flip = false){
  c.save(); c.translate(x, y); if (flip){ c.scale(1, -1); }
  c.beginPath(); c.roundRect(-10, -1, 4.5, 11, 1.2);
  c.moveTo(-3.5, 10); c.lineTo(5, 10); c.quadraticCurveTo(8, 10, 8.6, 7); c.lineTo(10, 0); c.quadraticCurveTo(10.5, -3.5, 7, -3.5); c.lineTo(2.5, -3.5); c.lineTo(3.4, -8); c.quadraticCurveTo(3.5, -11.5, .3, -11.5); c.lineTo(-3.5, -1.5); c.closePath();
  if (fill){ c.fillStyle = col; c.fill(); } else { c.strokeStyle = col; c.lineWidth = 1.8; c.lineJoin = 'round'; c.stroke(); }
  c.restore();
}

// ---- en vivo: gente que entra y sale
// Eventos deterministas: cada 0,2–0,6 s el número salta a un entero nuevo (tendencia + ruido).
function liveSim(s, from, to, p){
  const st = cState(s, p);
  if (!st.live) return { cur: Math.round(to), prev: Math.round(to), e: 1, dir: 1, pops: [], lastUp: null };
  const t = st.t, t0 = s.tStart || 0, CT = Math.max(.5, (s.tEnd || 2.9) - t0), m = Math.max(1, Math.round(to * .0016));
  const vals = [Math.round(from)], times = [0];
  let te = 0;
  for (let k = 0; k < 600; k++){
    te += .2 + seeded(k, 11) * .4; if (te > t) break;
    const u = Math.max(0, Math.min(1, (te - t0) / CT)), trend = from + (to - from) * (1 - Math.pow(1 - u, 3));
    let val = Math.max(0, Math.round(trend + (seeded(k, 12) - .5) * m * 4));
    if (val === vals[vals.length - 1]) val += seeded(k, 13) < .55 ? 1 : -1;
    vals.push(val); times.push(te);
  }
  const L = vals.length - 1, cur = vals[L], prev = L ? vals[L - 1] : cur, age = t - times[L];
  const pops = []; for (let i = L; i >= 1 && i > L - 4; i--){ const a = t - times[i]; if (a < .9) pops.push({ d: vals[i] - vals[i - 1], age: a, i }); }
  let lastUp = null; for (let i = L; i >= 1; i--){ if (vals[i] > vals[i - 1]){ lastUp = { i, age: t - times[i] }; break; } }
  return { cur, prev, e: L ? eoc(Math.min(1, age / .28)) : 1, dir: cur >= prev ? 1 : -1, pops, lastUp };
}
// Cada cifra que cambia se desliza: hacia arriba si sube, hacia abajo si baja.
function slotText(c, oldS, newS, e, dir, x, y, font, col, align = 'left'){
  c.font = font; const n = Math.max(oldS.length, newS.length), o = oldS.padStart(n, ' '), nw = newS.padStart(n, ' ');
  const widths = [...nw].map((ch, i) => Math.max(c.measureText(ch).width, c.measureText(o[i]).width)), total = widths.reduce((a, b) => a + b, 0);
  let cx = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
  const lh = parseFloat(font.match(/(\d+(?:\.\d+)?)px/)[1]) * 1.25;
  c.save(); c.beginPath(); c.rect(cx - 2, y - lh / 2, total + 4, lh); c.clip(); c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillStyle = col;
  for (let i = 0; i < n; i++){
    const a = o[i], b = nw[i];
    if (a === b || e >= 1){ if (b !== ' ') c.fillText(b, cx, y); }
    else {
      c.save(); c.globalAlpha *= 1 - e; if (a !== ' ') c.fillText(a, cx, y - dir * e * lh * .8); c.restore();
      c.save(); c.globalAlpha *= e; if (b !== ' ') c.fillText(b, cx, y + dir * (1 - e) * lh * .8); c.restore();
    }
    cx += widths[i];
  }
  c.restore(); return total;
}
function drawPops(c, pops, x, y, align = 'left'){
  pops.forEach((p, j) => { const k = p.age / .9; c.save(); c.globalAlpha *= 1 - k; shadow(c, 'rgba(0,0,0,.75)', 4, 1);
    txt(c, (p.d > 0 ? '+' : '−') + Math.abs(p.d), x + j * 4, y - 4 - eoc(k) * 24, F(13, 800, ROBO), p.d > 0 ? '#22C55E' : '#EF4444', align); c.restore(); });
}
function eyeGlyph(c, x, y, col){ c.strokeStyle = col; c.lineWidth = 1.8; c.beginPath(); c.moveTo(x - 9, y); c.quadraticCurveTo(x, y - 9, x + 9, y); c.quadraticCurveTo(x, y + 9, x - 9, y); c.stroke(); c.fillStyle = col; c.beginPath(); c.arc(x, y, 2.8, 0, TAU); c.fill(); }
function radioGlyph(c, x, y, col){ c.fillStyle = col; c.beginPath(); c.arc(x, y, 2.4, 0, TAU); c.fill(); c.strokeStyle = col; c.lineWidth = 1.6; c.lineCap = 'round';
  [5, 8.5].forEach(r => { c.beginPath(); c.arc(x, y, r, -Math.PI * .3, Math.PI * .3); c.stroke(); c.beginPath(); c.arc(x, y, r, Math.PI * .7, Math.PI * 1.3); c.stroke(); }); }

    c.beginPath(); c.roundRect(0, 0, W, H, 6); c.fillStyle = g; shadow(c, 'rgba(0,0,0,.4)', 18, 6); c.fill(); noShadow(c);
    c.font = F(17, 600, STEAMF); txt(c, fit(c, textLabel(s, 'Mi juego'), W - P * 2), P, P + 11, F(17, 600, STEAMF), '#FFFFFF');

    const ag = c.createLinearGradient(0, gy, 0, gy + gh); ag.addColorStop(0, 'rgba(102,192,244,.35)'); ag.addColorStop(1, 'rgba(102,192,244,0)'); c.fillStyle = ag; c.fill();

/* ---------- línea de tiempo ---------- */
const PRE = .3, HOLD = 1.8;

  return { w: full.w, h: full.h, draw(c){
    if (o.ind != null && t >= o.ind && t < o.start){

    }

stage.addEventListener('wheel', e => { if (!PH.img) return; e.preventDefault(); PH.w = Math.max(.05, Math.min(1, PH.w * (e.deltaY < 0 ? 1.06 : 1 / 1.06))); $('#pw').value = PH.w; rangeFill($('#pw')); draw(); }, { passive: false });

/* ============================== UI ============================== */
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const ic = (n, cls = '') => `<i data-lucide="${n}"${cls ? ` class="${cls}"` : ''}></i>`;
function icons(){ try { window.lucide && lucide.createIcons(); } catch (e) {} }
function rangeFill(el){ const p = (el.value - el.min) / (el.max - el.min) * 100; el.style.setProperty('--p', p + '%'); }
function badge(it){
  if (it.swatch === 'chk') return `<span class="bdg sw chk"></span>`;
  if (it.swatch) return `<span class="bdg sw" style="background:${it.swatch}"></span>`;
  return `<span class="bdg" style="--c:${it.color || 'var(--soft2)'}">${ic(it.icon || 'circle')}</span>`;
}

// ---- desplegable propio
let openDD = null;
function closeDD(){ if (!openDD) return; const p = openDD.pop; openDD.btn.classList.remove('open'); p.classList.remove('on'); setTimeout(() => p.remove(), 180); openDD = null; }
document.addEventListener('pointerdown', e => { if (openDD && !openDD.pop.contains(e.target) && !openDD.btn.contains(e.target)) closeDD(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDD(); });
window.addEventListener('resize', closeDD);
function dropdown(host, o){
  host.classList.add('dd'); host.innerHTML = '';
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'dd-btn'; host.appendChild(btn);
  const row = it => `${badge(it)}<span class="dd-l"><b>${esc(it.label)}</b>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</span>`;
  const render = () => { const list = o.items().filter(i => !i.group); const it = list.find(i => i.value === o.value()) || list[0]; btn.innerHTML = row(it) + ic('chevron-down', 'dd-chev'); icons(); };
  btn.onclick = () => {
    if (openDD && openDD.btn === btn){ closeDD(); return; }
    closeDD();
    const pop = document.createElement('div'); pop.className = 'dd-pop';
    for (const it of o.items()){
      if (it.group){ const g = document.createElement('div'); g.className = 'dd-g'; g.textContent = it.group; pop.appendChild(g); continue; }
      const b = document.createElement('button'); b.type = 'button'; const on = it.value === o.value();
      b.className = 'dd-o' + (on ? ' on' : ''); b.innerHTML = row(it) + (on ? ic('check', 'dd-ck') : '');
      b.onclick = () => { closeDD(); o.onChange(it.value); render(); };
      pop.appendChild(b);
    }
    document.body.appendChild(pop); icons();
    const r = btn.getBoundingClientRect(), w = Math.max(r.width, o.minW || 250);
    pop.style.width = w + 'px'; pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
    const below = innerHeight - r.bottom - 14;
    if (below < 260 && r.top > below){ pop.classList.add('up'); pop.style.bottom = (innerHeight - r.top + 6) + 'px'; pop.style.maxHeight = (r.top - 14) + 'px'; }
    else { pop.style.top = (r.bottom + 6) + 'px'; pop.style.maxHeight = below + 'px'; }
    requestAnimationFrame(() => pop.classList.add('on'));
    openDD = { btn, pop }; btn.classList.add('open');
    const cur = pop.querySelector('.dd-o.on'); if (cur) cur.scrollIntoView({ block: 'nearest' });
  };
  render(); return { render };
}

// ---- segmentados
function segCtl(el, get, set){
  const ind = el.querySelector('.ind'), btns = [...el.querySelectorAll('button')];
  const sync = () => { btns.forEach(b => b.classList.toggle('on', b.dataset.v === String(get()))); const on = btns.find(b => b.classList.contains('on')); if (on && ind){ ind.style.left = on.offsetLeft + 'px'; ind.style.width = on.offsetWidth + 'px'; } };
  btns.forEach(b => b.onclick = () => { set(b.dataset.v); sync(); });
  sync(); return sync;
}

// ---- textos
function bindText(id, key){ const el = $('#' + id); el.value = S[key]; el.oninput = () => { S[key] = el.value; refresh(); if (key === 'text' || key === 'name') thumbsSoon(); }; }
['text', 'name', 'user', 'time', 'likes'].forEach(k => bindText(k, k));

// ---- modo
const syncMode = segCtl($('#mode'), () => S.tab, v => { S.tab = v; syncTabs(); refresh(); bump(); });
function syncTabs(){ $('#cText').classList.toggle('hide', S.tab !== 'styles'); $('#cChat').classList.toggle('hide', S.tab !== 'chat'); markOn(); ddAnim.render(); syncMode(); }

// ---- apariencia
$('#dark').onclick = () => { S.dark = !S.dark; $('#dark').classList.toggle('on', S.dark); $('#dark').innerHTML = ic(S.dark ? 'moon-star' : 'moon'); icons(); refresh(); thumbs(); bump(); };
$('#dark').classList.toggle('on', S.dark);
$('#pad').value = S.pad; $('#padV').textContent = S.pad; rangeFill($('#pad'));
$('#pad').oninput = e => { S.pad = +e.target.value; $('#padV').textContent = S.pad; rangeFill(e.target); refresh(); };
function setAccent(c){ S.accent = c; document.documentElement.style.setProperty('--hi', c); renderSwatches(); refresh(); thumbs(); ddBg.render(); }
const colorIn = document.createElement('input'); colorIn.type = 'color'; colorIn.style.cssText = 'position:absolute;opacity:0;pointer-events:none;width:0;height:0'; document.body.appendChild(colorIn);
colorIn.oninput = e => setAccent(e.target.value);
function renderSwatches(){
  const sw = $('#sw'); sw.innerHTML = '';
  ACCENTS.forEach(c => { const b = document.createElement('button'); b.className = 's' + (c.toLowerCase() === S.accent.toLowerCase() ? ' on' : ''); b.style.background = c; b.style.color = c; b.onclick = () => setAccent(c); sw.appendChild(b); });
  const pick = document.createElement('button'); pick.className = 'ib'; pick.dataset.tip = 'Elegir color'; pick.innerHTML = ic('pipette'); pick.onclick = () => { colorIn.value = S.accent; colorIn.click(); };
  const rnd = document.createElement('button'); rnd.className = 'ib'; rnd.dataset.tip = 'Color al azar'; rnd.innerHTML = ic('dices'); rnd.onclick = () => setAccent(hslHex(Math.floor(Math.random() * 360), 78, 52));
  sw.append(pick, rnd); icons();
}
function hslHex(h, s, l){ s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return '#' + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join(''); }
document.documentElement.style.setProperty('--hi', S.accent);
renderSwatches();

const ddBg = dropdown($('#ddBg'), {
  items: () => [
    { value: 'transparent', label: 'Transparente', sub: 'PNG sin fondo', swatch: 'chk' },
    { value: 'light', label: 'Blanco', swatch: '#fff' }, { value: 'dark', label: 'Negro', swatch: '#000' },
    { value: 'chroma', label: 'Verde croma', sub: 'Para recortar en video', swatch: '#00FF00' },
    { value: 'accent', label: 'Acento suave', swatch: rgba(S.accent, .25) } ],
  value: () => S.bg, onChange: v => { S.bg = v; refresh(); bump(); }, minW: 230 });

// ---- animación
function animItems(){
  const a = ANIMS[autoAnimId()], ids = Object.keys(ANIMS);
  return [{ value: 'auto', label: 'Automática', sub: `${a.app ? a.label : 'Para ' + (S.tab === 'chat' ? APPS[curFam().app].name : APPS[STY[S.styleId].app].name)} · ${a.sub}`, icon: 'wand-sparkles', color: S.accent },
    { group: 'De apps' }, ...ids.filter(i => ANIMS[i].app).map(i => ({ value: i, label: ANIMS[i].label, sub: ANIMS[i].sub, icon: ANIMS[i].icon, color: ANIMS[i].color })),
    { group: 'Generales' }, ...ids.filter(i => !ANIMS[i].app).map(i => ({ value: i, label: ANIMS[i].label, sub: ANIMS[i].sub, icon: ANIMS[i].icon, color: ANIMS[i].color }))];
}
const ddAnim = dropdown($('#ddAnim'), { items: animItems, value: () => S.anim, onChange: v => { S.anim = v; save(); updateNow(); stopAnim(); play(); }, minW: 280 });

// ---- chat
const famItems = () => Object.entries(FAM).map(([k, f]) => ({ value: k, label: f.name, sub: k === 'classic' ? 'Burbujas brillantes' : k === 'sms' ? 'Burbujas verdes' : k === 'gm' ? 'Material You' : 'Burbujas y pantalla', icon: APPS[f.app].icon, color: APPS[f.app].color }));
const ddFamily = dropdown($('#ddFamily'), { items: famItems, value: () => S.family, onChange: v => { S.family = v; refresh(); ddAnim.render(); bump(); } });
function shotBtns(){
  const box = document.createElement('div'); box.className = 'row'; box.style.marginTop = '10px';
  box.innerHTML = `<button class="pill" id="shotB">${ic('smartphone')}Captura</button><button class="pill" id="frameB">${ic('tablet-smartphone')}Marco</button>`;
  $('#ddFamily').after(box);
  const sync = () => { for (const [id, k] of [['#shotB', 'shot'], ['#frameB', 'frame']]){ const b = $(id), on = !!S[k]; b.style.background = on ? 'var(--hi)' : ''; b.style.color = on ? '#fff' : ''; b.style.borderColor = on ? 'var(--hi)' : ''; } $('#frameB').style.opacity = S.shot ? 1 : .45; };
  $('#shotB').onclick = () => { S.shot = !S.shot; sync(); refresh(); bump(); };
  $('#frameB').onclick = () => { if (!S.shot) S.shot = true; S.frame = !S.frame; sync(); refresh(); bump(); };
  $('#shotB').dataset.tip = 'Pantalla completa de la app'; $('#frameB').dataset.tip = 'Marco de teléfono';
  sync();
}
shotBtns();
function renderMsgs(){
  const box = $('#msgs'); box.innerHTML = '';
  S.chat.forEach((m, i) => {
    const row = document.createElement('div'); row.className = 'msg' + (m.side === 'me' ? ' me' : '');
    row.innerHTML = `<button class="who" data-tip="${m.side === 'me' ? 'Yo' : 'Otro'}">${ic(m.side === 'me' ? 'user-round' : 'users-round')}</button><input type="text"><button class="ib sm del" data-tip="Borrar">${ic('trash-2')}</button>`;
    const inp = row.querySelector('input'); inp.value = m.text; inp.placeholder = m.side === 'me' ? 'Mensaje mío…' : 'Mensaje del otro…';
    inp.oninput = () => { m.text = inp.value; refresh(); };
    inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); addMsg(m.side === 'me' ? 'them' : 'me', i + 1); } };
    row.querySelector('.who').onclick = () => { m.side = m.side === 'me' ? 'them' : 'me'; renderMsgs(); refresh(); };
    row.querySelector('.del').onclick = () => { row.style.transition = 'all .2s'; row.style.opacity = 0; row.style.transform = 'translateX(-12px)'; setTimeout(() => { S.chat.splice(i, 1); renderMsgs(); refresh(); }, 160); };
    box.appendChild(row);
  });
  icons();
}
function addMsg(side, at = S.chat.length){ S.chat.splice(at, 0, { side, text: '' }); renderMsgs(); refresh(); $('#msgs').querySelectorAll('input')[at].focus(); }
$('#addMe').onclick = () => addMsg('me'); $('#addThem').onclick = () => addMsg('them');

// ---- detalles: avatar
const avEl = $('#av');
avEl.onclick = () => $('#avFile').click();
avEl.oncontextmenu = e => { e.preventDefault(); AV.img = null; avEl.classList.remove('has'); avEl.style.backgroundImage = ''; refresh(); thumbs(); };
$('#avFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; AV.img = await loadImg(f); avEl.style.backgroundImage = `url("${AV.img.src}")`; avEl.classList.add('has'); e.target.value = ''; refresh(); thumbs(); };

// ---- dock
const syncQ = () => { $('#q').textContent = S.q + '×'; };
$('#q').onclick = () => { S.q = S.q % 4 + 1; syncQ(); save(); toast(`Calidad ${S.q}×`, 'gauge', S.accent); };
syncQ();
$('#play').onclick = play; $('#play2').onclick = play;

// ---- galería
function updateNow(){
  let app, name;
  if (S.tab === 'chat'){ app = APPS[curFam().app]; name = S.shot ? 'Captura de chat' : 'Conversación'; } else { const st = STY[S.styleId]; app = APPS[st.app]; name = st.name; }
  const A = resolveAnim();
  $('#now').innerHTML = `${badge({ icon: app.icon, color: app.color })}<b>${esc(app.name)}</b><span>${esc(name)}</span><span class="an">${ic(A.icon)}${esc(A.label)}</span>`;
  icons();
}
const appItems = () => [{ value: 'all', label: 'Todas las apps', sub: `${STYLES.length} estilos`, icon: 'layout-grid', color: '#71717a' },
  ...Object.entries(GROUPS).map(([k, g]) => ({ value: 'g:' + k, label: g.name, sub: `${STYLES.filter(s => APPS[s.app].group === k).length} estilos`, icon: g.icon, color: g.color })),
  ...Object.entries(APPS).filter(([k]) => STYLES.some(s => s.app === k)).map(([k, a]) => ({ value: k, label: a.name, sub: `${STYLES.filter(s => s.app === k).length} estilos`, icon: a.icon, color: a.color }))];
dropdown($('#ddApp'), { items: appItems, value: () => S.app, onChange: v => { S.app = v; save(); renderGallery(); } });
segCtl($('#view'), () => S.view, v => { S.view = +v; save(); $('#gal').classList.toggle('g2', S.view === 2); thumbs(); });
$('#gal').classList.toggle('g2', S.view === 2);
function renderCats(){
  const box = $('#cats'); box.innerHTML = '';
  CATS.forEach(c => { const b = document.createElement('button'); b.className = c === S.cat ? 'on' : ''; b.dataset.tip = c; b.innerHTML = ic(CAT_ICON[c] || 'circle') + `<span>${c}</span>`;
    b.onclick = () => { S.cat = c; save(); renderCats(); renderGallery(); }; box.appendChild(b); });
  icons();
}
const cards = {};
function matches(st){
  const q = $('#find').value.trim().toLowerCase();
  return (S.cat === 'Todos' || st.cat === S.cat) && (S.app === 'all' || st.app === S.app || (S.app.startsWith('g:') && APPS[st.app].group === S.app.slice(2))) && (!q || (st.name + ' ' + APPS[st.app].name + ' ' + st.cat).toLowerCase().includes(q));
}
function renderGallery(){
  const g = $('#gal'); g.innerHTML = ''; let n = 0;
  STYLES.filter(matches).forEach(st => {
    let card = cards[st.id];
    if (!card){
      const app = APPS[st.app];
      card = document.createElement('div'); card.className = 'gc';
      card.innerHTML = `<div class="th"><canvas></canvas></div><div class="ft">${badge({ icon: app.icon, color: app.color })}<b>${esc(st.name)}</b><small>${esc(app.name)}</small></div>`;
      card.onclick = () => { S.styleId = st.id; S.tab = 'styles'; syncTabs(); markOn(); refresh(); bump(); if (st.counter){ stopAnim(); play(); } };
      cards[st.id] = card;
    }
    card.style.animationDelay = Math.min(n, 12) * 25 + 'ms'; card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
    g.appendChild(card); n++;
  });
  if (!n) g.innerHTML = `<div class="empty">${ic('search-x')}<br>Nada por acá</div>`;
  icons(); markOn(); thumbs();
}
function markOn(){ Object.entries(cards).forEach(([id, c]) => c.classList.toggle('on', id === S.styleId && S.tab === 'styles')); }
function thumbs(){
  const sample = { ...S, text: (S.text || 'hola mundo').slice(0, 90) };
  for (const st of STYLES){ const card = cards[st.id]; if (!card || !card.isConnected) continue;
    const cv = card.querySelector('canvas'), L = st.L(MC, sample);
    renderPlain(cv, 2, null, 'transparent', 6, L); cv.style.width = (L.w + 12) + 'px'; }
}
let thT = 0; function thumbsSoon(){ clearTimeout(thT); thT = setTimeout(thumbs, 250); }
$('#find').oninput = () => renderGallery();
$('#rnd').onclick = () => { const pool = STYLES.filter(matches); if (!pool.length) return; let st; do { st = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && st.id === S.styleId);
  S.styleId = st.id; S.tab = 'styles'; syncTabs(); markOn(); refresh(); bump(); cards[st.id].scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };

// ---- tema de la interfaz
const themes = ['auto', 'dark', 'light'], tIcon = { auto: 'sun-moon', dark: 'moon', light: 'sun' };
let uiT = 'auto'; try { uiT = localStorage.getItem('globo-ui') || 'auto'; } catch (e) {}
function applyUI(){ if (uiT === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = uiT; $('#uiTheme').innerHTML = ic(tIcon[uiT]); icons(); }
$('#uiTheme').onclick = () => { uiT = themes[(themes.indexOf(uiT) + 1) % 3]; try { localStorage.setItem('globo-ui', uiT); } catch (e) {} applyUI(); };
applyUI();

document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); $('#dl').click(); } });
new ResizeObserver(() => { if (!anim) draw(); }).observe(wrap);

renderMsgs(); renderCats(); renderGallery(); syncTabs(); syncPhotoUI(); syncHint(); updateNow(); icons(); draw();
document.fonts && document.fonts.ready.then(() => Promise.all(['700 20px "Comic Neue"', '600 30px Caveat', '34px Bangers', '400 15px Inter', '600 15px Inter', '700 15px Inter', '900 44px Inter'].map(f => document.fonts.load(f).catch(() => {})))).then(() => { draw(); thumbs(); syncMode(); });
</script>
</body>
</html>
