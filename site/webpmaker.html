<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Convertidor PNG/JPG → WebP (Múltiples con límite)</title>
  <link rel="stylesheet" href="/toolz/g7-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B" crossorigin="anonymous">
  <style>
    body{padding:2rem}
    .card{background:var(--g7-bg-3);border:1px solid var(--g7-border-2);padding:1.5rem;border-radius:var(--g7-radius-lg);max-width:500px;margin:0 auto;}
    .card h2{font-size:16px;font-weight:800;margin:0 0 16px;display:flex;align-items:center;gap:8px;}
    .card h2 i{color:var(--g7-accent);}
    input{width:100%;padding:7px 10px;margin-top:4px;border-radius:var(--g7-radius-sm);border:1px solid var(--g7-border-3);background:var(--g7-bg-4);color:var(--g7-text);font-size:12px;box-sizing:border-box;font-family:var(--g7-font);outline:none;}
    input:focus{border-color:var(--g7-accent);}
    input[type=file]{padding:6px;cursor:pointer;border-style:dashed;}
    input[type=file]:hover{border-color:var(--g7-accent);}
    button{width:100%;padding:9px;margin-top:10px;border-radius:var(--g7-radius-sm);border:none;background:var(--g7-accent);color:#000;font-weight:700;cursor:pointer;font-size:12px;font-family:var(--g7-font);transition:opacity .15s,transform .15s;}
    button:hover{opacity:.85;transform:translateY(-1px);}
    img{margin-top:1rem;max-width:100%;border-radius:var(--g7-radius-sm);}
    label{margin-top:10px;display:block;color:var(--g7-text-3);font-size:11px;font-weight:600;}
    .image-block{margin-top:10px;border:1px solid var(--g7-border-2);padding:10px;border-radius:var(--g7-radius-sm);background:var(--g7-bg-4);}
    .image-block a{display:block;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--g7-accent);}
  </style>
</head>
<body>
  <div class="card">
    <h2><i class="fa-solid fa-image"></i> Convertidor PNG/JPG → WebP</h2>

    <label>1) Elige imágenes (PNG o JPG)</label>
    <input type="file" id="imageFile" accept="image/png, image/jpeg" multiple>

    <label>2) Calidad inicial de compresión (0-100)</label>
    <input type="number" id="quality" value="80" min="1" max="100">

    <label>3) Tamaño máximo de archivo (KB)</label>
    <input type="number" id="maxSize" value="200" min="1">

    <button id="convertBtn">Convertir a WebP</button>

    <div id="output"></div>
  </div>

<script src="/toolz/assets/tools/webpmaker.js"></script>
</body>
</html>
